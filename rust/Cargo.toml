[package]
name = "alfred-jetbrains-cli"
version = "0.3.1"
edition = "2024"
description = "Fast Alfred workflow CLI for opening JetBrains projects"
license = "MIT"
authors = ["MrChang0"]
repository = "https://github.com/chang-open-source/alfred-jetbrains-rust"

[[bin]]
name = "jb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
glob = "0.3"
plist = "1"
regex = "1"
rustix = { version = "1", features = ["fs"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
tempfile = "3"
